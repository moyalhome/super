name: deploy

# Every morning: download today's prices, build the data files, build the web app and publish it to GitHub Pages.
on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC = 05:00/06:00 in Israel
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["web/**", "ingest/**", ".github/workflows/deploy.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IL_SUPERMARKETS_CACHE: ${{ github.workspace }}/.cache
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests

      - id: day
        run: echo "d=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      # Only dated public price files are cached. The geocode cache is NOT cached: it would contain the home coordinates.
      - uses: actions/cache@v4
        with:
          path: |
            .cache/*.tsv
            .cache/stores-*.json
            .cache/cities-*.json
          key: prices2-${{ steps.day.outputs.d }}
          restore-keys: prices2-

      - name: Prepare cache dir
        run: |
          mkdir -p .cache
          cp ingest/geocode_seed.json .cache/geocode.json
          find .cache -type f \( -name '*.tsv' -o -name 'stores-*.json' -o -name 'cities-*.json' \) ! -name "*-${{ steps.day.outputs.d }}.*" -delete

      - name: Download prices and build data files
        id: pipeline
        continue-on-error: true
        env:
          HOME_ADDRESS: ${{ secrets.HOME_ADDRESS }}
          RADIUS_KM: "4"
        run: python ingest/run_pipeline.py web/public/data

      - name: Fall back to the last published data
        if: steps.pipeline.outcome != 'success'
        run: |
          echo "::warning::Price download failed, reusing the previously published data"
          mkdir -p web/public/data
          for f in stores prices names weighted brands meta; do
            curl -fsS "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/$f.json" -o "web/public/data/$f.json" || { [ "$f" = brands ] && echo "{}" > "web/public/data/$f.json"; }
          done

      - name: Check the data files exist
        run: |
          for f in stores prices names weighted brands meta; do test -s "web/public/data/$f.json" || { echo "::error::missing web/public/data/$f.json"; exit 1; }; done
          cat web/public/data/meta.json | head -c 300; echo

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web app
        working-directory: web
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          npm ci
          npm run build

      - name: Keep the free Supabase project awake
        if: ${{ vars.SUPABASE_URL != '' }}
        continue-on-error: true
        env:
          SB_URL: ${{ vars.SUPABASE_URL }}
          SB_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          curl -fsS -X POST "$SB_URL/rest/v1/rpc/ping" \
            -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" \
            -H "Content-Type: application/json" -d '{}' > /dev/null
          echo "supabase ping ok"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
